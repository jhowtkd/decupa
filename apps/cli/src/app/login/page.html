<body>
<main class="login-card">
  <div class="brand" aria-label="decupa"><span class="brand-mark" aria-hidden="true"></span><strong>decupa</strong></div>
  <p class="eyebrow">Bancada editorial</p>
  <h1>Entrar no Decupa</h1>
  <p class="intro">Use a senha da equipe e seu nome de exibição.</p>
  <form id="loginForm">

  </form>
</main>
