<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>decupa · limpar fala</title>
<style>
  :root {
    --bg: #12171a; --panel: #1a2125; --line: #2a3439;
    --ink: #e4e9e5; --muted: #94a0a5; --accent: #f2c230;
    --ok: #63be97; --warn: #e0765c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.75 ui-serif, Georgia, serif;
  }
  header {
    position: sticky; top: 0; display: flex; align-items: center; gap: 18px;
    padding: 12px 18px; border-bottom: 1px solid var(--line);
    background: var(--panel); font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 13px;
  }
  main { max-width: 44rem; margin: 0 auto; padding: 32px 20px 120px; }
  button {
    font: inherit; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  /* A unidade inteira é o alvo de clique. Um ✕ dentro do fluxo, mesmo com
     opacity:0, continua ocupando espaço: medido em 14,4 px por unidade, 446 px
     ao todo num corte de 31 trechos — buracos visíveis num texto cuja única
     função é ser lido corrido. */
  .u { cursor: pointer; border-radius: 3px; transition: background 90ms; }
  .u:hover { background: #e0765c26; box-shadow: 0 0 0 2px #e0765c26; }
  /* Dropada: colapsa para um marcador com as primeiras palavras, e o texto
     em volta se fecha. O título traz o texto inteiro. */
  .gone {
    display: inline-block; max-width: 12rem; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom;
    font-family: ui-sans-serif, sans-serif; font-size: 11px;
    color: var(--muted); background: #ffffff0d; border: 1px dashed var(--line);
    border-radius: 4px; padding: 0 6px; margin: 0 2px; cursor: pointer;
  }
  .gone:hover { color: var(--ink); border-color: var(--accent); }
  .flag-badge {
    display: inline-block; width: 0.42em; height: 0.42em; margin: 0 0.1em 0.35em;
    border-radius: 50%; background: var(--warn); vertical-align: super; opacity: 0.75;
  }
  .join { display: block; margin: 14px 0; font-family: ui-sans-serif, sans-serif; font-size: 12px; }
  .join .flag { color: var(--warn); display: block; padding-left: 10px; border-left: 2px solid var(--warn); }
  .join .hint { color: var(--muted); }
  #stage { color: var(--muted); font-family: ui-sans-serif, sans-serif; }
  #aviso { color: var(--warn); font-family: ui-sans-serif, sans-serif; font-size: 12px; }
</style>
</head>
<body>
<header>
  <strong>decupa</strong>
  <span style="color:var(--muted);font-size:12px">clique num trecho para tirá-lo · clique no marcador para trazer de volta</span>
  <span id="stage">carregando…</span>
  <span id="aviso"></span>
  <span style="flex:1"></span>
  <!-- Nascem desabilitados: sem review, keepList() estouraria em review.units
       de null, e a pessoa clicaria durante os minutos de transcrição. -->
  <button id="cancelar">cancelar</button>
  <button id="triar" disabled>sugerir cortes</button>
  <button id="edl" disabled>exportar EDL</button>
  <button id="mp4" disabled>exportar MP4</button>
  <button id="txt" disabled>transcrição</button>
</header>
<main id="prosa"></main>
<script type="module">
const jobId = new URLSearchParams(location.search).get("job") || window.__JOB__;
let review = null, kept = new Map(), timer = null;

const api = (p, o) => fetch(`/jobs/${jobId}${p}`, o).then((r) => r.json());

// keepListFrom e expandKeepList vêm de /keeplist.js, servido pelo servidor a
// partir do módulo testado em keeplist.ts. Não reimplementar aqui: é o único
// parser na borda com o motor, e uma faixa errada corta no lugar errado sem
// erro nenhum.
import { expandKeepList, keepListFrom } from "/keeplist.js";

const keepList = () =>
  keepListFrom(review.units.filter((u) => kept.get(u.id)).map((u) => u.id));

function render() {
  const joinsBy = new Map(review.joins.map((j) => [j.afterUnitId, j]));
  const main = document.getElementById("prosa");
  main.replaceChildren();
  for (const u of review.units) {
    if (kept.get(u.id)) {
      const span = document.createElement("span");
      span.className = "u";
      span.append(u.text + " ");
      const reasons = (u.flags ?? []).map((f) => f.message).filter(Boolean);
      if (reasons.length) {
        const badge = document.createElement("span");
        badge.className = "flag-badge";
        badge.title = reasons.join(" · ");
        span.append(badge);
      }
      span.title = reasons.length
        ? reasons.join(" · ")
        : "clique para tirar este trecho";
      span.onclick = () => {
        // Um clique que terminou uma seleção é alguém lendo, não editando —
        // e a tela existe para ser lida.
        if (String(document.getSelection() ?? "").length > 0) return;
        kept.set(u.id, false);
        render();
        schedule();
      };
      main.append(span);
      const join = joinsBy.get(u.id);
      if (join?.flags?.length) main.append(joinNode(join));
    } else {
      const mark = document.createElement("span");
      mark.className = "gone";
      mark.textContent = u.text;      // o CSS trunca; o título mostra inteiro
      const goneReasons = (u.flags ?? []).map((f) => f.message).filter(Boolean);
      mark.title = goneReasons.length
        ? `restaurar: ${u.text}\n${goneReasons.join(" · ")}`
        : `restaurar: ${u.text}`;
      mark.onclick = () => { kept.set(u.id, true); render(); schedule(); };
      main.append(mark);
    }
  }
  document.getElementById("stage").textContent =
    `${review.units.filter((u) => kept.get(u.id)).length}/${review.units.length} trechos · ` +
    `${review.outputSeconds.toFixed(0)}s de ${review.sourceSeconds.toFixed(0)}s`;
}

// O motor emite os avisos em inglês. Este é o único texto da tela que carrega
// julgamento editorial — é ele que diz que um corte lê errado — e deixá-lo na
// língua do motor num app em português é falhar exatamente onde importa.
// Conjunto fechado de oito códigos; qualquer outro cai no texto original.
const AVISOS = {
  mid_thought_out: {
    msg: "o trecho anterior não fecha a frase, então o corte lê como pensamento interrompido",
    dica: "estenda até a unidade que termina a frase, ou corte antes dela",
  },
  answer_without_question: {
    msg: "a pergunta que este trecho respondia saiu no corte",
    dica: "traga a pergunta de volta, ou comece num trecho que reafirme o assunto",
  },
  no_silence_at_cut: {
    msg: "não há pausa neste ponto — o corte cai dentro da fala",
    dica: "ouça esta junção antes de exportar",
  },
  mid_word_cut: {
    msg: "o corte cai no meio de uma palavra",
    dica: "isto é audível: ajuste o trecho",
  },
  broken_reference_in: {
    msg: "o trecho seguinte se refere a algo que foi cortado",
    dica: "traga de volta o que ele cita, ou corte o trecho seguinte junto",
  },
  orphan_connective_in: {
    msg: "o trecho seguinte abre com conectivo apontando para algo que saiu",
    dica: "traga o antecedente de volta, ou comece o corte depois do conectivo",
  },
  enumeration_gap: {
    msg: "a enumeração perdeu um item no meio",
    dica: "traga o item de volta, ou tire a enumeração inteira",
  },
  tight_filler_excision: {
    msg: "a remoção de cacoete ficou colada demais na fala",
    dica: "ouça esta junção antes de exportar",
  },
  visual_in_point: {
    msg: "a junção entra com um problema visual (mão no rosto, olhar baixo ou sem rosto)",
    dica: "mova o in-point +0,4s no EDL",
  },
};

function joinNode(join) {
  const box = document.createElement("span");
  box.className = "join";
  for (const f of join.flags) {
    const pt = AVISOS[f.code];
    const el = document.createElement("span");
    el.className = "flag";
    el.textContent = `⚠ ${pt ? pt.msg : f.message}`;
    // O texto do motor fica no title: se a tradução resumir demais, o
    // original continua a um hover de distância.
    el.title = f.message;
    const hint = document.createElement("span");
    hint.className = "hint";
    hint.textContent = ` → ${pt ? pt.dica : f.hint}`;
    el.append(hint);
    box.append(el);
  }
  return box;
}

// Clique não re-planeja: 250ms depois do último, o servidor recalcula as
// junções. Sem isso, um aviso de mid_thought_out apontaria para uma junção
// que não existe mais.
function schedule() {
  clearTimeout(timer);
  timer = setTimeout(async () => {
    const list = keepList();
    if (!list) {
      document.getElementById("stage").textContent =
        "pelo menos um trecho precisa permanecer";
      return;
    }
    const res = await fetch(`/jobs/${jobId}/keep`, {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ keepList: list }),
    });
    const r = await res.json();
    if (!res.ok || r.error) {
      document.getElementById("stage").textContent =
        r.error ?? `erro ${res.status}`;
      return;
    }
    if (r.review) { review = r.review; render(); }
  }, 250);
}

async function poll() {
  const j = await api("");
  document.getElementById("aviso").textContent = j.warning ?? "";
  document.getElementById("stage").textContent = {
    queued: "na fila…", transcribing: "transcrevendo (leva alguns minutos)…",
    indexing: "medindo…", visual: "índice visual (opcional)…",
    planning: "planejando…", cancelled: "cancelado",
  }[j.stage] ?? j.stage;
  if (j.stage === "error") { document.getElementById("stage").textContent = "erro: " + j.error; return; }
  if (j.stage === "ready" && j.review) {
    review = j.review;
    kept = new Map(review.units.map((u) => [u.id, u.kept]));
    for (const id of ["triar", "edl", "mp4", "txt"]) {
      document.getElementById(id).disabled = false;
    }
    document.getElementById("cancelar").disabled = true;
    render();
    return;
  }
  if (j.stage !== "cancelled") setTimeout(poll, 1000);
}

document.getElementById("cancelar").onclick = async () => {
  await api("/cancel", { method: "POST" });
  document.getElementById("stage").textContent = "cancelado";
};

document.getElementById("triar").onclick = async () => {
  const r = await api("/triage", { method: "POST" });
  if (r.error) { alert(r.error); return; }
  // Prévia, não aplicação muda: mostra o que cairia antes de mexer na tela.
  const proposto = new Set(expandKeepList(r.keepList));
  const cairiam = review.units.filter((u) => kept.get(u.id) && !proposto.has(u.id));
  // Com o motivo que o modelo deu, não só o texto do trecho: a justificativa é
  // o que permite discordar. E ela confabula quando não entende a unidade, o
  // que só dá para perceber lendo.
  const dropLines = (r.drop ?? []).map((d) =>
    "· " + d.unit_ids.join(", ") + " — " + d.reason + " — " + d.note
  );
  const lookLines = (r.reviewFlags ?? []).map((f) =>
    "· " + f.unitId + " — " + f.message
  );
  const preview = (r.drop || r.reviewFlags)
    ? `vai cair (retake limpo):\n${dropLines.join("\n") || "· nenhum"}\n\n` +
      `olhe isto (sem substituto):\n${lookLines.join("\n") || "· nenhum"}`
    : `A sugestão tira ${cairiam.length} trecho(s):\n\n` +
      cairiam.map((u) => "· " + u.text.slice(0, 60)).join("\n") +
      (r.motivos?.length ? "\n\nMotivos:\n" + r.motivos.join("\n") : "");
  const ok = confirm(preview + "\n\nAplicar?");
  if (!ok) return;
  for (const u of review.units) kept.set(u.id, proposto.has(u.id));
  render(); schedule();
};

for (const [id, kind] of [["edl", "edl"], ["mp4", "mp4"], ["txt", "transcript"]]) {
  document.getElementById(id).onclick = async () => {
    const r = await api("/export", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ kind, keepList: keepList() }),
    });
    if (r.error) { alert(r.error); return; }
    location.href = r.downloadUrl;
  };
}

poll();
</script>
</body>
</html>
