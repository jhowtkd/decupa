<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>decupa · limpar fala</title>
<style>
  :root {
    --bg-0: #111316; --bg-1: #181B20; --bg-2: #20242B;
    --line: #2B3038; --line-strong: #3A414B;
    --ink: #E9E7E2; --muted: #9AA0A9; --faint: #6B7280;
    --accent: #F2C230; --on-accent: #1B1508;
    --warn: #E0765C; --ok: #63BE97;
    --serif: Charter, "Iowan Old Style", Georgia, serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --sans-ui: system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg-0); color: var(--ink);
    font: 16px/1.75 ui-serif, Georgia, serif;
    min-height: 100dvh;
  }
  header {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 14px;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    background: var(--bg-1); font-family: var(--sans-ui); font-size: 13px;
  }
  header .brand { font-weight: 700; }
  header .crumb { color: var(--muted); }
  header .spacer, header .export-wrap { margin-left: 0; }
  header .spacer { flex: 1; }
  header[data-mode="process"] .crumb { display: none; }
  .stats { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; color: var(--muted); }
  .stats b { color: var(--ink); font-size: 16px; font-weight: 600; }
  .stats .sep { display: inline-block; width: 1px; height: 14px; background: var(--line-strong); margin: 0 8px; vertical-align: -2px; }
  .stats .dim { color: var(--faint); }
  .export-wrap { position: relative; }
  #export-menu {
    position: absolute; right: 0; top: 38px; z-index: 3; min-width: 180px;
    background: var(--bg-2); border: 1px solid var(--line-strong); border-radius: 10px;
    padding: 4px; display: flex; flex-direction: column;
  }
  #export-menu button {
    background: none; border: none; height: 30px; border-radius: 6px;
    font: 500 13px var(--sans-ui); color: var(--ink); justify-content: flex-start;
  }
  #export-menu button:hover { background: var(--bg-1); }
  #export-menu[hidden] { display: none; }
  main { max-width: none; padding: 40px 24px 180px; }
  #prosa {
    max-width: 34em; margin: 0 auto;
    font-family: var(--serif); font-size: 20px; line-height: 1.65;
  }
  button {
    display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 12px; border-radius: 6px;
    font: 600 13px/1 var(--sans-ui, system-ui); color: var(--ink);
    background: var(--bg-2); border: 1px solid var(--line-strong); cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button.quiet { background: transparent; border-color: transparent; color: var(--muted); }
  button.quiet:hover { color: var(--ink); }
  button.danger { background: transparent; border-color: transparent; color: var(--warn); }
  button:disabled { opacity: .45; cursor: default; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Ouvir é absoluto: no fluxo, até opacity:0 abre buracos na prosa. */
  .u { position: relative; cursor: pointer; border-radius: 3px; transition: background 90ms; }
  .u:hover { background: #e0765c26; box-shadow: 0 0 0 2px #e0765c26; }
  /* Botão-palavra na prosa: sem o chrome do sistema de botões. */
  .u .play, .gone .play {
    position: absolute; right: 100%; top: 0.2em; margin-right: 4px;
    opacity: 0; pointer-events: none; height: auto;
    background: none; border: none;
    font: 600 11px/1 ui-sans-serif, system-ui, sans-serif;
    padding: 2px 6px; white-space: nowrap;
  }
  .u:hover .play, .gone:hover .play, .u .play:focus-visible, .gone .play:focus-visible {
    opacity: 1; pointer-events: auto;
  }
  /* Cortado: o próprio texto, riscado inline — sem chip, sem elipse. */
  .gone {
    position: relative;
    color: var(--faint);
    text-decoration: line-through; text-decoration-color: var(--warn); text-decoration-thickness: 1.5px;
    cursor: pointer; border-radius: 3px;
  }
  .gone:hover { color: var(--muted); background: #ffffff0d; }
  .flag-badge {
    display: inline-block; width: 0.42em; height: 0.42em; margin: 0 0.1em 0.35em;
    border-radius: 50%; background: var(--warn); vertical-align: super; opacity: 0.75;
  }
  .join { display: block; margin: 16px 0; font-family: var(--sans-ui); font-size: 12.5px; }
  .join-head {
    display: inline-flex; align-items: center; gap: 6px;
    font: 600 11px var(--mono); letter-spacing: .06em; text-transform: uppercase;
    color: var(--faint); border-left: 2px solid var(--line-strong); padding-left: 8px;
  }
  .join .flag { color: var(--warn); display: block; padding: 2px 0 0 10px; border-left: 2px solid var(--warn); }
  .join .play { color: var(--accent); }
  .join-dur { color: var(--warn); text-transform: none; letter-spacing: 0; }
  #aviso { color: var(--warn); font-family: var(--sans-ui); font-size: 12px; }
  .steps {
    list-style: none; margin: 0; padding: 0;
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px;
  }
  .steps li { padding: 8px 0; color: var(--muted); border-bottom: 1px solid var(--line); }
  .steps li.done { color: var(--ok); }
  .steps li.current { color: var(--ink); font-weight: 600; }
  .steps li.current::before { content: "→ "; color: var(--accent); }
  .process-hint, .status-body {
    font-family: ui-sans-serif, system-ui, sans-serif;
    color: var(--muted); font-size: 14px; max-width: 40rem;
  }
  .status-title { font-family: ui-sans-serif, system-ui, sans-serif; font-weight: 600; }
  #player { position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; }
  #triage {
    position: sticky; bottom: 0; z-index: 2;
    background: var(--bg-1); border-top: 1px solid var(--line);
    padding: 18px 22px 20px; font-family: var(--sans-ui); font-size: 13px;
    max-height: 46vh; overflow: auto;
  }
  #triage[hidden] { display: none; }
  #triage h2 { margin: 0; font-size: 14px; }
  #triage .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 6px; }
  #triage .lbl { color: var(--muted); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; margin: 12px 0 4px; }
  #triage .lbl.data { font-family: var(--mono); text-transform: none; letter-spacing: 0; }
  #triage ul { margin: 0; padding: 0; list-style: none; }
  #triage li { margin: 3px 0; color: var(--ink); }
  #triage .actions { display: flex; gap: 8px; margin-top: 14px; }
  @media (max-width: 760px) { #triage .cols { grid-template-columns: 1fr; } }
  .skeleton { max-width: 34em; margin: 0 auto 22px; display: flex; flex-direction: column; gap: 12px; }
  .skeleton span { height: 14px; border-radius: 4px; background: var(--bg-2); animation: pulse 1.2s ease-in-out infinite; }
  .skeleton span:nth-child(2) { width: 88%; }
  .skeleton span:nth-child(3) { width: 62%; }
  @keyframes pulse { 50% { opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { .skeleton span { animation: none; } }
  kbd {
    font-family: ui-monospace, Menlo, monospace; font-size: .92em; color: var(--ink);
    background: #232c31; border: 1px solid var(--line-strong); border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 6px;
  }
  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: var(--ok); color: #10201a; font-weight: 600;
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px;
    padding: 10px 20px; border-radius: 6px; opacity: 0; transition: opacity .2s;
    pointer-events: none; z-index: 5;
  }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--warn); color: #2a1410; }
</style>
</head>
<body>
<header data-mode="process">
  <span class="brand">decupa</span>
  <span class="crumb">limpar fala</span>
  <span id="stage" class="stats" hidden>
    <b id="kept-count">0</b><span class="dim">/</span><span id="total-count">0</span> trechos
    <span class="sep"></span>
    <b id="out-sec">0</b>s <span class="dim">de</span> <span id="src-sec">0</span>s
  </span>
  <span id="aviso"></span>
  <span class="spacer"></span>
  <button id="cancelar" class="danger">cancelar</button>
  <!-- Sem review, keepList() estoura; nascem desabilitados. -->
  <button id="triar" disabled>sugerir cortes</button>
  <div class="export-wrap">
    <button id="exportar" class="primary" disabled>exportar</button>
    <div id="export-menu" hidden>
      <button data-export="edl">timeline .edl</button>
      <button data-export="mp4">vídeo .mp4</button>
      <button data-export="srt">legendas .srt</button>
      <button data-export="transcript">transcrição .txt</button>
    </div>
  </div>
</header>
<main id="prosa"></main>
<aside id="triage" hidden>
  <h2>prévia da triagem</h2>
  <p id="triage-stats" class="lbl data"></p>
  <div class="cols">
    <div>
      <p class="lbl">vai cair (retake limpo)</p>
      <ul id="triage-drop"></ul>
    </div>
    <div>
      <p class="lbl">olhe isto (sem substituto)</p>
      <ul id="triage-look"></ul>
    </div>
  </div>
  <div class="actions">
    <button type="button" class="primary" id="triage-apply">aplicar</button>
    <button type="button" id="triage-dismiss">descartar</button>
  </div>
</aside>
<video id="player" preload="auto" playsinline></video>
<div id="toast"></div>
<script type="module">
const jobId = new URLSearchParams(location.search).get("job") || window.__JOB__;
let review = null, kept = new Map(), timer = null, playGen = 0, pendingKeep = null;

const api = (p, o) => fetch(`/jobs/${jobId}${p}`, o).then((r) => r.json());
const el = (id) => document.getElementById(id);
const JOIN_PAD = 0.7;
const STEPS = [["queued","na fila"],["transcribing","transcrevendo"],["indexing","medindo"],["visual","índice visual"],["planning","planejando"]];

// keepList vem do módulo testado; não reimplementar — faixa errada corta sem erro.
import { expandKeepList, keepListFrom } from "/keeplist.js";

const keepList = () =>
  keepListFrom(review.units.filter((u) => kept.get(u.id)).map((u) => u.id));

function toast(message, isError) {
  const node = el("toast");
  node.textContent = message;
  node.className = isError ? "show err" : "show";
  setTimeout(() => { node.className = isError ? "err" : ""; }, 2200);
}

function setMode(mode) {
  document.querySelector("header").dataset.mode = mode;
}

function canPlay(start, end) {
  return Number.isFinite(start) && Number.isFinite(end) && end > start;
}

function playBtn(label, onPlay) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "play";
  btn.textContent = label;
  btn.onclick = (ev) => { ev.stopPropagation(); onPlay(); };
  return btn;
}

function playRanges(ranges) {
  const gen = ++playGen;
  const player = el("player");
  player.pause();
  if (!player.src) player.src = "/media";
  return (async () => {
    for (const [start, end] of ranges) {
      if (gen !== playGen) return;
      await new Promise((resolve) => {
        const done = () => {
          player.removeEventListener("timeupdate", onTime);
          player.removeEventListener("ended", done);
          resolve();
        };
        const onTime = () => {
          if (gen !== playGen || player.currentTime >= end - 0.04) {
            player.pause();
            done();
          }
        };
        player.addEventListener("timeupdate", onTime);
        player.addEventListener("ended", done);
        const startPlay = () => {
          player.currentTime = Math.max(0, start);
          player.play().catch(() => done());
        };
        if (player.readyState >= 1) startPlay();
        else player.addEventListener("loadedmetadata", startPlay, { once: true });
      });
    }
  })();
}

function playUnit(u) {
  if (!canPlay(u.start, u.end)) return;
  playRanges([[u.start, u.end]]);
}

function playJoin(join) {
  const out = Number(join.sourceOut);
  const inn = Number(join.sourceIn);
  if (!Number.isFinite(out) || !Number.isFinite(inn)) return;
  playRanges([
    [Math.max(0, out - JOIN_PAD), out],
    [inn, inn + JOIN_PAD],
  ]);
}

function renderProcessing(stage, progress) {
  setMode("process");
  el("stage").hidden = true;
  const idx = STEPS.findIndex((s) => s[0] === stage);
  const ol = document.createElement("ol");
  ol.className = "steps";
  for (let i = 0; i < STEPS.length; i++) {
    const li = document.createElement("li");
    li.textContent = STEPS[i][1];
    li.className = i < idx ? "done" : i === idx ? "current" : "pending";
    ol.append(li);
  }
  const hint = document.createElement("p");
  hint.className = "process-hint";
  hint.textContent = stage === "transcribing"
    ? "a transcrição leva alguns minutos"
    : "aguardando o motor…";
  // Três barras no lugar da prosa que ainda não existe.
  const skel = document.createElement("div");
  skel.className = "skeleton";
  for (let i = 0; i < 3; i++) skel.append(document.createElement("span"));
  const nodes = [skel, ol, hint];
  if (progress) {
    // A última linha do processo, verbatim. Não é barra de progresso: é prova
    // de que ainda está andando, que é a pergunta que a pessoa tem.
    const live = document.createElement("p");
    live.className = "process-hint";
    live.style.fontFamily = "ui-monospace, Menlo, monospace";
    live.textContent = progress;
    nodes.push(live);
  }
  el("prosa").replaceChildren(...nodes);
}

function renderMessage(title, body) {
  setMode("process");
  el("stage").hidden = true;
  const h = document.createElement("p");
  h.className = "status-title";
  h.textContent = title;
  const p = document.createElement("p");
  p.className = "status-body";
  p.textContent = body;
  el("prosa").replaceChildren(h, p);
}

function render() {
  setMode("review");
  const joinsBy = new Map(review.joins.map((j) => [j.afterUnitId, j]));
  const main = el("prosa");
  main.replaceChildren();
  let joinCount = 0;
  for (const u of review.units) {
    if (kept.get(u.id)) {
      const span = document.createElement("span");
      span.className = "u";
      span.append(u.text + " ");
      const reasons = (u.flags ?? []).map((f) => f.message).filter(Boolean);
      if (reasons.length) {
        const badge = document.createElement("span");
        badge.className = "flag-badge";
        badge.title = reasons.join(" · ");
        span.append(badge);
      }
      span.title = reasons.length
        ? reasons.join(" · ")
        : "clique para tirar este trecho";
      if (canPlay(u.start, u.end)) span.append(playBtn("ouvir", () => playUnit(u)));
      span.onclick = () => {
        if (String(document.getSelection() ?? "").length > 0) return;
        kept.set(u.id, false);
        render();
        schedule();
      };
      main.append(span);
      const join = joinsBy.get(u.id);
      if (join?.flags?.length) main.append(joinNode(join, ++joinCount));
    } else {
      const mark = document.createElement("span");
      mark.className = "gone";
      mark.textContent = u.text;   // inteiro: o risco mostra tudo, sem elipse
      const goneReasons = (u.flags ?? []).map((f) => f.message).filter(Boolean);
      mark.title = goneReasons.length
        ? `restaurar: ${u.text}\n${goneReasons.join(" · ")}`
        : `restaurar: ${u.text}`;
      if (canPlay(u.start, u.end)) mark.append(playBtn("ouvir", () => playUnit(u)));
      mark.onclick = () => { kept.set(u.id, true); render(); schedule(); };
      main.append(mark);
    }
  }
  el("kept-count").textContent = review.units.filter((u) => kept.get(u.id)).length;
  el("total-count").textContent = review.units.length;
  el("out-sec").textContent = review.outputSeconds.toFixed(0);
  el("src-sec").textContent = review.sourceSeconds.toFixed(0);
  el("stage").hidden = false;
}

// Avisos do motor vêm em inglês; traduzir aqui é o julgamento editorial da tela.
const AVISOS = {
  mid_thought_out: ["o trecho anterior não fecha a frase, então o corte lê como pensamento interrompido", "estenda até a unidade que termina a frase, ou corte antes dela"],
  answer_without_question: ["a pergunta que este trecho respondia saiu no corte", "traga a pergunta de volta, ou comece num trecho que reafirme o assunto"],
  no_silence_at_cut: ["não há pausa neste ponto — o corte cai dentro da fala", "ouça esta junção antes de exportar"],
  mid_word_cut: ["o corte cai no meio de uma palavra", "isto é audível: ajuste o trecho"],
  broken_reference_in: ["o trecho seguinte se refere a algo que foi cortado", "traga de volta o que ele cita, ou corte o trecho seguinte junto"],
  orphan_connective_in: ["o trecho seguinte abre com conectivo apontando para algo que saiu", "traga o antecedente de volta, ou comece o corte depois do conectivo"],
  enumeration_gap: ["a enumeração perdeu um item no meio", "traga o item de volta, ou tire a enumeração inteira"],
  tight_filler_excision: ["a remoção de cacoete ficou colada demais na fala", "ouça esta junção antes de exportar"],
  visual_in_point: ["a junção entra com um problema visual (mão no rosto, olhar baixo ou sem rosto)", "mova o in-point +0,4s no EDL"],
};

function joinNode(join, n) {
  const box = document.createElement("span");
  box.className = "join";
  const head = document.createElement("span");
  head.className = "join-head";
  head.textContent = `corte ${n}`;
  const dur = document.createElement("span");
  dur.className = "join-dur";
  dur.textContent = ` -${join.removedSeconds.toFixed(1).replace(".", ",")}s`;
  head.append(dur);
  box.append(head);
  for (const f of join.flags) {
    const pt = AVISOS[f.code];
    const node = document.createElement("span");
    node.className = "flag";
    node.textContent = `⚠ ${pt ? pt[0] : f.message}`;
    node.title = f.message;
    const hint = document.createElement("span");
    hint.className = "hint";
    hint.textContent = ` → ${pt ? pt[1] : f.hint}`;
    node.append(hint);
    box.append(node);
  }
  if (Number.isFinite(join.sourceOut) && Number.isFinite(join.sourceIn)) {
    box.append(playBtn("ouvir junção", () => playJoin(join)));
  }
  return box;
}

// Clique não re-planeja: 250ms depois, o servidor recalcula as junções.
function schedule() {
  clearTimeout(timer);
  timer = setTimeout(async () => {
    const list = keepList();
    if (!list) {
      toast("pelo menos um trecho precisa permanecer", true);
      return;
    }
    const res = await fetch(`/jobs/${jobId}/keep`, {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ keepList: list }),
    });
    const r = await res.json();
    if (!res.ok || r.error) {
      toast(r.error ?? `erro ${res.status}`, true);
      return;
    }
    if (r.review) { review = r.review; render(); }
  }, 250);
}

function readyFrom(j) {
  review = j.review;
  kept = new Map(review.units.map((u) => [u.id, u.kept]));
  for (const id of ["triar", "exportar"]) el(id).disabled = false;
  el("cancelar").disabled = true;
  render();
}

async function poll() {
  const j = await api("");
  el("aviso").textContent = j.warning ?? "";
  if (j.stage === "error") {
    renderMessage("não deu para processar", j.error ?? "erro desconhecido");
    el("cancelar").disabled = true;
    return;
  }
  if (j.stage === "cancelled") {
    renderMessage("cancelado", "o processamento parou. feche a aba ou rode de novo pela linha de comando.");
    return;
  }
  if (j.stage === "ready" && j.review) {
    readyFrom(j);
    return;
  }
  renderProcessing(j.stage, j.progress);
  setTimeout(poll, 1000);
}

el("cancelar").onclick = async () => {
  await api("/cancel", { method: "POST" });
  renderMessage("cancelado", "o processamento parou. feche a aba ou rode de novo pela linha de comando.");
};

function fillList(node, lines) {
  node.replaceChildren();
  if (lines.length === 0) {
    const li = document.createElement("li");
    li.textContent = "nenhum";
    node.append(li);
    return;
  }
  for (const line of lines) {
    const li = document.createElement("li");
    li.textContent = line;
    node.append(li);
  }
}

el("triar").onclick = async () => {
  const btn = el("triar");
  btn.disabled = true;
  btn.textContent = "triando…";
  try {
    const r = await api("/triage", { method: "POST" });
    if (r.error) {
      toast(r.error, true);
      if (/chave|API_KEY|não está setada/i.test(r.error)) {
        btn.hidden = true;
        btn.title = r.error;
      }
      return;
    }
    // Prévia, não aplicação muda.
    pendingKeep = r.keepList;
    const proposto = new Set(expandKeepList(r.keepList));
    const cairiam = review.units.filter((u) => kept.get(u.id) && !proposto.has(u.id));
    const dropLines = (r.drop ?? []).map((d) =>
      d.unit_ids.join(", ") + " — " + d.reason + " — " + d.note
    );
    const lookLines = (r.reviewFlags ?? []).map((f) =>
      f.unitId + " — " + f.message
    );
    const drop = (r.drop || r.reviewFlags)
      ? dropLines
      : cairiam.map((u) => u.text.slice(0, 80));
    const look = (r.drop || r.reviewFlags)
      ? lookLines
      : (r.motivos ?? []);
    fillList(el("triage-drop"), drop);
    fillList(el("triage-look"), look);
    // Uma linha de contexto, não dashboard: quem decide lê e segue.
    el("triage-stats").textContent = r.stats ? r.stats.summary : "";
    el("triage").hidden = false;
  } finally {
    if (!btn.hidden) {
      btn.disabled = false;
      btn.textContent = "sugerir cortes";
    }
  }
};

el("triage-apply").onclick = () => {
  if (pendingKeep == null) return;
  const proposto = new Set(expandKeepList(pendingKeep));
  for (const u of review.units) kept.set(u.id, proposto.has(u.id));
  el("triage").hidden = true;
  pendingKeep = null;
  render();
  schedule();
};

el("triage-dismiss").onclick = () => {
  el("triage").hidden = true;
  pendingKeep = null;
};

const exportMenu = el("export-menu");
el("exportar").onclick = () => { exportMenu.hidden = !exportMenu.hidden; };
document.addEventListener("click", (ev) => {
  if (!ev.target.closest(".export-wrap")) exportMenu.hidden = true;
});
for (const btn of exportMenu.querySelectorAll("[data-export]")) {
  const kind = btn.dataset.export;
  btn.onclick = async () => {
    exportMenu.hidden = true;
    const label = btn.textContent;
    btn.disabled = true;
    btn.textContent = "exportando…";
    try {
      const r = await api("/export", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ kind, keepList: keepList() }),
      });
      if (r.error) { toast(r.error, true); return; }
      toast("download a caminho");
      location.href = r.downloadUrl;
    } finally {
      btn.disabled = false;
      btn.textContent = label;
    }
  };
}

poll();
</script>
</body>
</html>
