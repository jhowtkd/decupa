<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>decupa · montagem</title>
<link rel="icon" href="data:,">
<meta name="decupa-project-dir" content="">
<link rel="stylesheet" href="/page.css">
</head>
<body data-stage="materiais">
<header id="topbar" aria-label="Projeto">
  <div class="topbar-project">
    <strong class="brand"><svg class="brand-mark" width="20" height="14" viewBox="0 0 20 14" aria-hidden="true"><path d="M6.2 1h12.3a1 1 0 0 1 .95 1.3l-3.1 9.4a1.5 1.5 0 0 1-1.4 1H2.6a1 1 0 0 1-.95-1.3l3.1-9.4A1.5 1.5 0 0 1 6.2 1z" fill="currentColor"/></svg>decupa</strong>
    <span class="sep" aria-hidden="true"></span>
    <span id="projectName">Montagem principal</span>
    <span id="versionPill" class="pill mono" hidden></span>
    <details class="project-menu">
      <summary aria-label="Menu do projeto"><svg class="i" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="3.5" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="12.5" cy="8" r="1.3"/></svg></summary>
      <div class="menu-pop">
        <button type="button" id="newProject">Novo projeto</button>
        <a href="/templates">Templates editoriais</a>
        <p id="projectDirLine" class="project-dir" hidden>Pasta do projeto <span id="projectDir" class="mono"></span></p>
      </div>
    </details>
  </div>
  <nav id="stages" aria-label="Etapas">
    <button type="button" data-stage="materiais" aria-current="page"><span class="step-mark" aria-hidden="true"></span>Materiais</button>
    <button type="button" data-stage="edicao"><span class="step-mark" aria-hidden="true"></span>Edição</button>
    <button type="button" data-stage="revisao"><span class="step-mark" aria-hidden="true"></span>Revisão</button>
    <button type="button" data-stage="entrega"><span class="step-mark" aria-hidden="true"></span>Entrega</button>
  </nav>
  <div class="topbar-actions">
    <span id="transcriptNotice" class="pill pill-accent" hidden></span>
    <span id="status" class="pill" role="status" aria-live="polite">carregando…</span>
    <button type="button" id="monitorToggle" class="only-narrow" aria-controls="monitor" aria-expanded="false">Monitor</button>
    <span id="primaryAction"></span>
  </div>
</header>
<aside id="rail" class="card" aria-label="Projeto"></aside>
<main id="center" class="card" aria-label="Texto">
  <div id="textoHead" class="card-head">
    <h1>Texto</h1>
    <span id="textoMeta" class="pill mono" hidden></span>
    <span class="spacer"></span>
    <span id="undoSlot"></span>
  </div>
  <section id="texto" aria-label="Texto"></section>
</main>
<aside id="monitor" class="card" aria-label="Monitor">
  <button type="button" id="closeMonitor" class="quiet only-narrow">Fechar monitor</button>
  <section id="stage" aria-label="Prévia">
    <video id="previewPlayer" controls preload="metadata"></video>
  </section>
  <section id="activity" aria-label="Andamento da montagem" hidden></section>
  <section id="faixa" aria-label="Sequência"></section>
  <section id="contexto" aria-label="Revisão e ajustes"></section>
  <section id="monitorBriefing" aria-label="Briefing" hidden></section>
</aside>
<div id="dropzone" hidden tabindex="0" role="button" aria-label="Enviar arquivos de mídia">
  Arraste arquivos para cá ou clique para escolher
  <input type="file" id="filePicker" accept="video/*,audio/*" multiple hidden>
</div>
<script type="module" src="/page.js"></script>
</body>
</html>
