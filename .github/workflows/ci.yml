name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # A suíte básica é portátil: os fixtures saem do FFmpeg (lavfi) e nada mais
    # chama `say`, então Linux, macOS e Windows rodam a suíte completa. Linux
    # acompanha a base Ubuntu da VPS/Docker. Certificação e pendências por SO:
    # docs/plataformas-suportadas.md. O motor de condense não é clonado antes
    # da suíte JS — os testes de preflight usam motor
    # falso em tmpdir, e o gold do motor (tests/engine-gold.test.ts) se pula
    # sozinho quando ele falta. WhisperX/modelos também não são baixados aqui:
    # os testes do doctor usam dependências fake.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Chaves de IA vazias de propósito: nenhum teste pode depender de credencial
    # real, e tests/assembly-flow.test.ts exige que elas sejam falsy.
    env:
      ZAI_API_KEY: ""
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      MINIMAX_API_KEY: ""
      DECUPA_API_KEY: ""
      TYPESAFE_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - name: instalar ffmpeg (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg

      - name: instalar ffmpeg (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install ffmpeg

      - name: instalar ffmpeg (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          Add-Content $env:GITHUB_PATH 'C:\ProgramData\chocolatey\bin'

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: versões efetivas do ambiente
        shell: bash
        run: |
          {
            printf '### Ambiente de validação (%s)\n\n```text\n' '${{ runner.os }}'
            node --version
            pnpm --version
            python --version
            ffmpeg -version
            ffprobe -version
            printf '```\n'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm smoke
      - run: pnpm test --maxWorkers=2

      # Testes Python com mocks: não baixam modelo nem precisam dos venvs dos
      # sidecars (WhisperX, MediaPipe), só da biblioteca padrão.
      # Um passo por comando: no Windows o pwsh só olha o código do último
      # comando do script, e a falha da fala sumiria atrás do passo da visão.
      - name: testes Python da fala
        run: python -m unittest discover -s services/speech -p "test_*.py"

      - name: testes Python da visão
        run: python -m unittest discover -s services/vision -p "test_*.py"

      # O render importa o motor, clonado do bundle do repositório sem rede.
      # Linux e macOS: a prova de recursos lê a árvore pelo `ps` e usa sinais
      # POSIX. Windows continua com os testes JS e Python dos sidecars.
      - name: testes Python do render
        if: runner.os != 'Windows'
        run: |
          node scripts/setup.mjs --engine-only
          python -m unittest discover -s scripts -p "test_render_*.py"

  e2e:
    # Testes de navegador (Playwright) da jornada do studio contra o servidor
    # real, só no Ubuntu. Cada teste sobe o CLI (`decupa serve`) sobre uma Raiz
    # semeada: a transcrição vem pronta (os modelos de fala não são baixados
    # aqui) e a prévia sai do motor real, clonado do bundle do repositório sem
    # rede. O p95 medido é relatório; o teto de 100 ms vale no ambiente de
    # referência (docs/superpowers/evidence/2026-10-23-studio-ensaios.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ZAI_API_KEY: ""
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      MINIMAX_API_KEY: ""
      DECUPA_API_KEY: ""
      TYPESAFE_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - name: instalar ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Plano B, desligado: se o render real quebrar com o FFmpeg do apt,
      # DECUPA_E2E_MOTOR=sintetico no `pnpm e2e` troca só o compositor por um
      # MP4 liso na duração da timeline (e2e/apoio/motor-sintetico). Registrar no PR.
      - name: motor de render (bundle do repositório)
        run: node scripts/setup.mjs --engine-only

      - name: navegador do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: versões efetivas do ambiente
        run: |
          {
            printf '### Ambiente do e2e\n\n```text\n'
            node --version
            python3 --version
            ffmpeg -version | head -n 1
            pnpm exec playwright --version
            printf '```\n'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - run: pnpm e2e

      # Flaky (passou só na segunda tentativa) fica listado no summary, junto
      # com o p95 de cada interação.
      - name: resumo do e2e
        if: always()
        run: node --experimental-strip-types --no-warnings e2e/apoio/resumo-ci.ts >> "$GITHUB_STEP_SUMMARY"

      - name: evidências da falha (trace, screenshot, relatório)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-falha
          path: |
            test-results/
            playwright-report/
          retention-days: 14

      - name: medidas de desempenho
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-desempenho
          path: test-results/desempenho-*.json
          if-no-files-found: ignore
