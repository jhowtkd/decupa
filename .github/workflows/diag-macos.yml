name: diag-macos

# Temporário: confirma a correção do nome de arquivo de tarefa.
# Branch de diagnóstico; nunca mesclar.
on:
  push:
    branches: ['diag/**']

env:
  ZAI_API_KEY: ""
  OPENAI_API_KEY: ""
  GEMINI_API_KEY: ""
  MINIMAX_API_KEY: ""
  DECUPA_API_KEY: ""
  TYPESAFE_API_KEY: ""

jobs:
  diag-macos:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: brew install ffmpeg
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: A - TMPDIR padrão com a correção
        continue-on-error: true
        shell: bash
        run: pnpm exec vitest run apps/cli/src/app/project-new-http.test.ts -t "aguarda a análise" --testTimeout=20000 --reporter=verbose

      - name: regressão do coordenador com a correção
        continue-on-error: true
        shell: bash
        run: pnpm exec vitest run packages/coordinator/src/coordinator.test.ts -t "limite de nome de arquivo" --reporter=verbose

  diag-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: B - TMPDIR longo com a correção
        continue-on-error: true
        shell: bash
        run: |
          T=/tmp/$(printf 'd%.0s' $(seq 1 75))
          mkdir -p "$T"
          TMPDIR="$T" pnpm exec vitest run apps/cli/src/app/project-new-http.test.ts -t "aguarda a análise" --testTimeout=20000 --reporter=verbose

      - name: regressão do coordenador com a correção
        continue-on-error: true
        shell: bash
        run: pnpm exec vitest run packages/coordinator/src/coordinator.test.ts -t "limite de nome de arquivo" --reporter=verbose
