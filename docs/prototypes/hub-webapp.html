<!-- Copia de apps/cli/src/app/hub-prototype.html mantida em docs/prototypes para documentacao do ticket #116 -->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Protótipo de Interface · Hub Webapp de Projetos (Decupa)</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --card-border: #30363d;
      --card-hover: #1c2128;
      --accent-green: #238636;
      --accent-green-hover: #2ea043;
      --accent-blue: #1f6feb;
      --accent-blue-hover: #388bfd;
      --accent-purple: #8957e5;
      --warning: #d29922;
      --danger: #f85149;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --font-mono: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      border-bottom: 1px solid var(--card-border);
      background: #090d13;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    .brand span { color: var(--text-muted); font-weight: 400; }
    .nav-links { display: flex; align-items: center; gap: 16px; font-size: 13px; }
    .nav-links a { color: var(--text-muted); text-decoration: none; display: flex; align-items: center; gap: 6px; }
    .nav-links a:hover { color: var(--text); }
    .user-pill {
      background: #21262d;
      border: 1px solid var(--card-border);
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .user-dot { width: 8px; height: 8px; border-radius: 50%; background: #3fb950; }

    .container { max-width: 1140px; margin: 24px auto; padding: 0 20px; }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .badge-montar { background: #1f6feb22; color: #58a6ff; border: 1px solid #1f6feb; }
    .badge-limpar { background: #23863622; color: #3fb950; border: 1px solid #238636; }
    .badge-locked { background: #d2992222; color: #e3b341; border: 1px solid #d29922; }
    .badge-free { background: #30363d55; color: var(--text-muted); border: 1px solid var(--card-border); }

    button {
      background: #21262d;
      color: var(--text);
      border: 1px solid var(--card-border);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    button:hover { background: #30363d; border-color: #8b949e; }
    button.primary { background: var(--accent-green); border-color: rgba(240, 246, 252, 0.1); color: #fff; }
    button.primary:hover { background: var(--accent-green-hover); }
    button.blue { background: var(--accent-blue); border-color: rgba(240, 246, 252, 0.1); color: #fff; }
    button.blue:hover { background: var(--accent-blue-hover); }

    .variant-a-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; }
    .variant-a-title h2 { font-size: 22px; font-weight: 600; }
    .variant-a-title p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
    }
    .project-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .project-card:hover { transform: translateY(-2px); border-color: #8b949e; background: var(--card-hover); }
    .card-thumb {
      height: 120px;
      background: #090d13;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      position: relative;
    }
    .thumb-duration {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0,0,0,0.75);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-family: var(--font-mono);
    }
    .card-body { padding: 14px; }
    .card-meta-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .card-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .card-meta-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(48, 54, 61, 0.5);
    }

    .drawer-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(2px);
      display: none;
      z-index: 100;
    }
    .drawer-overlay.active { display: block; }
    .drawer {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 440px;
      background: var(--card-bg);
      border-left: 1px solid var(--card-border);
      padding: 24px;
      display: flex;
      flex-direction: column;
      z-index: 101;
      transform: translateX(100%);
      transition: transform 0.25s ease;
    }
    .drawer.active { transform: translateX(0); }
    .dropzone {
      border: 2px dashed var(--card-border);
      border-radius: 8px;
      padding: 32px 16px;
      text-align: center;
      background: #0d1117;
      margin: 16px 0;
      cursor: pointer;
    }
    .dropzone:hover { border-color: var(--accent-blue); background: #161b22; }

    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
    }
    .table-toolbar {
      padding: 12px 16px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f141c;
      gap: 12px;
    }
    .search-input {
      background: #0d1117;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 7px 12px;
      color: var(--text);
      font-size: 13px;
      width: 260px;
    }
    table.editorial-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }
    table.editorial-table th {
      padding: 10px 14px;
      background: #161b22;
      border-bottom: 1px solid var(--card-border);
      color: var(--text-muted);
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    table.editorial-table td {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(48, 54, 61, 0.5);
    }
    table.editorial-table tr:hover td { background: var(--card-hover); }
    .project-name-cell { font-weight: 600; display: flex; align-items: center; gap: 8px; }

    .dual-doors {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 32px;
    }
    .door-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 24px;
      position: relative;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .door-card:hover { border-color: var(--accent-blue); transform: translateY(-3px); }
    .door-card.clean:hover { border-color: var(--accent-green); }
    .door-icon {
      width: 44px; height: 44px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 14px;
      font-size: 20px;
    }
    .door-icon.assembly { background: #1f6feb22; color: #58a6ff; }
    .door-icon.clean { background: #23863622; color: #3fb950; }
    .door-title { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
    .door-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
    .door-drop {
      border: 1px dashed var(--card-border);
      border-radius: 6px;
      padding: 16px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      background: #0d1117;
    }

    .proto-switcher {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1c2128;
      border: 1px solid #444c56;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border-radius: 30px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 1000;
    }
    .proto-btn {
      background: #2d333b;
      border: 1px solid #444c56;
      color: var(--text);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
    }
    .proto-btn:hover { background: #373e47; }
    .proto-label {
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .proto-tag {
      background: #1f6feb;
      color: #fff;
      padding: 2px 7px;
      border-radius: 10px;
      font-size: 10px;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h7"/></svg>
    <strong>decupa</strong> <span>/ hub de projetos</span>
  </div>
  <div class="nav-links">
    <a href="/templates">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      Templates
    </a>
    <a href="/settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Configurações
    </a>
    <div class="user-pill">
      <span class="user-dot"></span>
      <span>Equipe Decupa</span>
    </div>
  </div>
</header>

<main class="container" id="mainContainer"></main>

<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="newProjectDrawer">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
    <h3 style="font-size:16px;">Novo Projeto</h3>
    <button onclick="closeDrawer()" style="padding:4px 8px;">✕</button>
  </div>
  <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">
    Envie os arquivos de vídeo ou áudio para criar um novo projeto no volume persistente.
  </p>
  
  <label style="font-size:12px;font-weight:600;display:block;margin-bottom:6px;">Nome do Projeto</label>
  <input type="text" placeholder="Ex.: Podcast Ep 14" style="width:100%;background:#0d1117;border:1px solid var(--card-border);border-radius:6px;padding:8px 12px;color:var(--text);font-size:13px;margin-bottom:16px;">

  <label style="font-size:12px;font-weight:600;display:block;margin-bottom:6px;">Fluxo de Trabalho</label>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;">
    <label style="background:#0d1117;border:1px solid var(--accent-blue);border-radius:6px;padding:10px;cursor:pointer;font-size:12px;">
      <input type="radio" name="mode" checked> <strong>Montagem</strong>
      <div style="color:var(--text-muted);font-size:11px;margin-top:4px;">Multiarquivo + IA</div>
    </label>
    <label style="background:#0d1117;border:1px solid var(--card-border);border-radius:6px;padding:10px;cursor:pointer;font-size:12px;">
      <input type="radio" name="mode"> <strong>Limpeza</strong>
      <div style="color:var(--text-muted);font-size:11px;margin-top:4px;">Arquivo único</div>
    </label>
  </div>

  <div class="dropzone" onclick="alert('Simulação de seleção de arquivos. O upload chunked resumível enviará os blocos para /data/media/.tmp/')">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="color:var(--text-muted);margin-bottom:8px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
    <div style="font-size:13px;font-weight:600;">Arraste os vídeos aqui</div>
    <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">Suporta MP4, MOV, MKV, WAV</div>
  </div>

  <div style="margin-top:auto;">
    <button class="primary" style="width:100%;justify-content:center;padding:10px;" onclick="alert('Criando projeto e despachando ingestão...');closeDrawer();">Criar Projeto e Iniciar</button>
  </div>
</div>

<div class="proto-switcher">
  <button class="proto-btn" onclick="prevVariant()" title="Variante anterior (←)">←</button>
  <div class="proto-label">
    <span class="proto-tag" id="variantTag">A</span>
    <span id="variantName">Studio Workbench</span>
  </div>
  <button class="proto-btn" onclick="nextVariant()" title="Próxima variante (→)">→</button>
</div>

<script>
const MOCK_PROJECTS = [
  { id: "proj_01", name: "Entrevista Founder Ep 03", type: "montar", duration: "00:42:18", modified: "há 10 min", locked: true, editor: "jhonatan (você)", files: 3 },
  { id: "proj_02", name: "Vídeo Institucional 2026", type: "montar", duration: "00:08:45", modified: "há 2 horas", locked: false, editor: null, files: 5 },
  { id: "proj_03", name: "Limpeza Fala Aula 01", type: "limpar", duration: "00:18:20", modified: "ontem", locked: false, editor: null, files: 1 },
  { id: "proj_04", name: "Depoimentos Clientes Q3", type: "montar", duration: "01:14:02", modified: "há 3 dias", locked: true, editor: "mateus", files: 7 },
  { id: "proj_05", name: "Limpeza Rápida Podcast A", type: "limpar", duration: "00:55:10", modified: "há 5 dias", locked: false, editor: null, files: 1 }
];

function renderVariantA() {
  return `
    <div class="variant-a-header">
      <div class="variant-a-title">
        <h2>Projetos Recentes</h2>
        <p>Acesse suas timelines salvas ou inicie um novo corte.</p>
      </div>
      <div>
        <button class="primary" onclick="openDrawer()">+ Novo Projeto</button>
      </div>
    </div>

    <div class="card-grid">
      ${MOCK_PROJECTS.map(p => `
        <div class="project-card" onclick="openProject('${p.id}', ${p.locked})">
          <div class="card-thumb">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 8 6 4-6 4Z"/></svg>
            <div class="thumb-duration">${p.duration}</div>
          </div>
          <div class="card-body">
            <div class="card-meta-top">
              <span class="badge ${p.type === 'montar' ? 'badge-montar' : 'badge-limpar'}">${p.type}</span>
              <span class="badge ${p.locked ? 'badge-locked' : 'badge-free'}">${p.locked ? '🔒 ' + p.editor : 'Livre'}</span>
            </div>
            <div class="card-title">${p.name}</div>
            <div class="card-meta-bottom">
              <span>${p.files} arquivo(s) de mídia</span>
              <span>${p.modified}</span>
            </div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderVariantB() {
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div>
        <h2 style="font-size:20px;font-weight:600;">Diretório de Projetos</h2>
        <p style="font-size:12px;color:var(--text-muted);">Visualização densa para operação de alto volume.</p>
      </div>
      <button class="primary" onclick="openDrawer()">+ Novo Projeto</button>
    </div>

    <div class="table-container">
      <div class="table-toolbar">
        <input type="text" class="search-input" placeholder="Buscar projetos por nome...">
        <div style="display:flex;gap:8px;">
          <button style="font-size:12px;padding:6px 10px;">Filtro: Todos</button>
          <button style="font-size:12px;padding:6px 10px;">Ordenar: Recentes</button>
        </div>
      </div>
      <table class="editorial-table">
        <thead>
          <tr>
            <th>Nome do Projeto</th>
            <th>Tipo</th>
            <th>Duração</th>
            <th>Mídias</th>
            <th>Última Edição</th>
            <th>Status de Lock</th>
            <th style="text-align:right;">Ações</th>
          </tr>
        </thead>
        <tbody>
          ${MOCK_PROJECTS.map(p => `
            <tr>
              <td class="project-name-cell">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 8 6 4-6 4Z"/><rect width="18" height="18" x="3" y="3" rx="2"/></svg>
                <span>${p.name}</span>
              </td>
              <td><span class="badge ${p.type === 'montar' ? 'badge-montar' : 'badge-limpar'}">${p.type}</span></td>
              <td style="font-family:var(--font-mono);">${p.duration}</td>
              <td>${p.files}</td>
              <td style="color:var(--text-muted);">${p.modified}</td>
              <td>
                <span class="badge ${p.locked ? 'badge-locked' : 'badge-free'}">${p.locked ? '🔒 ' + p.editor : 'Disponível'}</span>
              </td>
              <td style="text-align:right;">
                <button style="padding:4px 8px;font-size:12px;" onclick="openProject('${p.id}', ${p.locked})">Abrir</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderVariantC() {
  return `
    <div style="text-align:center;max-width:600px;margin:0 auto 32px;">
      <h2 style="font-size:24px;font-weight:600;margin-bottom:8px;">O que você vai editar hoje?</h2>
      <p style="font-size:14px;color:var(--text-muted);">Escolha o fluxo ideal para o seu material ou continue um projeto em andamento.</p>
    </div>

    <div class="dual-doors">
      <div class="door-card" onclick="openDrawer()">
        <div class="door-icon assembly">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        </div>
        <div class="door-title">Nova Montagem</div>
        <div class="door-desc">Para projetos multi-câmera, eventos e podcasts. Organiza falas por tema, alinha B-rolls e aplica receitas de edição.</div>
        <div class="door-drop">+ Criar Montagem com Mídias</div>
      </div>

      <div class="door-card clean" onclick="openDrawer()">
        <div class="door-icon clean">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
        <div class="door-title">Nova Limpeza de Fala</div>
        <div class="door-desc">Para um único vídeo bruto ou aula. Remove silêncios mortos, vícios de linguagem e pausas automaticamente.</div>
        <div class="door-drop">+ Limpar Vídeo Único</div>
      </div>
    </div>

    <h3 style="font-size:15px;margin-bottom:14px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;">Projetos em Andamento</h3>
    <div class="card-grid">
      ${MOCK_PROJECTS.slice(0, 3).map(p => `
        <div class="project-card" onclick="openProject('${p.id}', ${p.locked})">
          <div class="card-body">
            <div class="card-meta-top">
              <span class="badge ${p.type === 'montar' ? 'badge-montar' : 'badge-limpar'}">${p.type}</span>
              <span class="badge ${p.locked ? 'badge-locked' : 'badge-free'}">${p.locked ? '🔒 ' + p.editor : 'Livre'}</span>
            </div>
            <div class="card-title">${p.name}</div>
            <div class="card-meta-bottom">
              <span>Duração: ${p.duration}</span>
              <span>${p.modified}</span>
            </div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

const VARIANTS = [
  { key: "A", name: "Studio Workbench (Cards + Gaveta)", render: renderVariantA },
  { key: "B", name: "Tabela Editorial (Alta Densidade)", render: renderVariantB },
  { key: "C", name: "Portas de Workflow (Montar vs Limpar)", render: renderVariantC }
];

let currentIdx = 0;

function setVariant(key) {
  const idx = VARIANTS.findIndex(v => v.key.toUpperCase() === key.toUpperCase());
  if (idx !== -1) currentIdx = idx;
  const active = VARIANTS[currentIdx];

  document.getElementById("variantTag").textContent = active.key;
  document.getElementById("variantName").textContent = active.name;
  document.getElementById("mainContainer").innerHTML = active.render();

  const url = new URL(window.location);
  url.searchParams.set("variant", active.key);
  window.history.replaceState({}, "", url);
}

function nextVariant() {
  currentIdx = (currentIdx + 1) % VARIANTS.length;
  setVariant(VARIANTS[currentIdx].key);
}

function prevVariant() {
  currentIdx = (currentIdx - 1 + VARIANTS.length) % VARIANTS.length;
  setVariant(VARIANTS[currentIdx].key);
}

window.addEventListener("keydown", e => {
  if (["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
  if (e.key === "ArrowRight") nextVariant();
  if (e.key === "ArrowLeft") prevVariant();
});

function openDrawer() {
  document.getElementById("drawerOverlay").classList.add("active");
  document.getElementById("newProjectDrawer").classList.add("active");
}
function closeDrawer() {
  document.getElementById("drawerOverlay").classList.remove("active");
  document.getElementById("newProjectDrawer").classList.remove("active");
}

function openProject(id, locked) {
  if (locked) {
    if (!confirm(`Este projeto está com lock ativo por outro membro da equipe. Abrir em modo leitura ou forçar liberação do lock?`)) {
      return;
    }
  }
  alert(`Navegando para o editor do projeto ${id} (rota /projects/${id})...`);
}

const initialKey = new URLSearchParams(window.location.search).get("variant") || "A";
setVariant(initialKey);
</script>
