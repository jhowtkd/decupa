name: decupa

services:
  decupa:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DECUPA_VARIANT: ${DECUPA_VARIANT:-cpu}
        DECUPA_UID: ${DECUPA_UID:-1000}
        DECUPA_GID: ${DECUPA_GID:-1000}
    image: ${DECUPA_IMAGE:-decupa}:${DECUPA_VARIANT:-cpu}
    init: true
    restart: unless-stopped
    expose:
      - "7788"
    environment:
      DECUPA_AUTH_PASSWORD: "${DECUPA_AUTH_PASSWORD:?DECUPA_AUTH_PASSWORD precisa ser definida}"
      DECUPA_BIND_HOST: 0.0.0.0
      DECUPA_TRUST_PROXY: "1"
      DECUPA_ALLOWED_HOSTS: "${DECUPA_ALLOWED_HOSTS:-${DECUPA_DOMAIN:-localhost},decupa}"
      DECUPA_MEDIA_ROOT: /data/media
      DECUPA_R2_ACCOUNT_ID: "${DECUPA_R2_ACCOUNT_ID:-}"
      DECUPA_R2_BUCKET: "${DECUPA_R2_BUCKET:-}"
      DECUPA_R2_ACCESS_KEY_ID: "${DECUPA_R2_ACCESS_KEY_ID:-}"
      DECUPA_R2_SECRET_ACCESS_KEY: "${DECUPA_R2_SECRET_ACCESS_KEY:-}"
      DECUPA_JOB_CONCURRENCY: "${DECUPA_JOB_CONCURRENCY:-1}"
      DECUPA_NO_BROWSER: "1"
      HF_HOME: /home/decupa/.cache/huggingface
      TORCH_HOME: /home/decupa/.cache/torch
    volumes:
      - decupa-cache:/home/decupa/.cache
      - decupa-config:/home/decupa/.decupa
      - decupa-projects:/data/projects
      - decupa-media:/data/media

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      decupa:
        condition: service_healthy
    ports:
      - "${DECUPA_HTTP_PORT:-80}:80"
      - "${DECUPA_HTTPS_PORT:-443}:443"
    environment:
      DECUPA_DOMAIN: "${DECUPA_DOMAIN:-localhost}"
      DECUPA_TLS_MODE: "${DECUPA_TLS_MODE:-auto}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/caddy-entrypoint.sh:/usr/local/bin/decupa-caddy-entrypoint.sh:ro
      - caddy-data:/data
      - caddy-config:/config
    entrypoint: ["/bin/sh", "/usr/local/bin/decupa-caddy-entrypoint.sh"]

volumes:
  decupa-cache:
  decupa-config:
  decupa-projects:
  decupa-media:
  caddy-data:
  caddy-config:
